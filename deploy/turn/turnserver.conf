# ============================================================
# Coturn STUN/TURN Server Configuration for QRDrop
# RFC 5766 Turn REST API with Ephemeral HMAC-SHA1 Credentials
# ============================================================

# Primary listening ports
listening-port=3478
tls-listening-port=5349

# UDP/TCP relay port range (NAT traversal)
min-port=49152
max-port=65535

# Enable STUN/TURN fingerprint in messages
fingerprint

# Ephemeral Time-Windowed Credentials (RFC 5766)
use-auth-secret
static-auth-secret=qrdrop-ephemeral-turn-secret-key-change-me
realm=qrdrop.app

# Security & Isolation
no-cli
no-loopback-peers
no-multicast-peers
mobility

# Logging
verbose
log-file=stdout
